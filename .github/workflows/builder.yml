name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SocksDroid source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "platform-tools"

      - name: Download official Xray Android ARM64 core
        shell: bash
        run: |
          set -euo pipefail
          XRAY_VERSION="v26.11.9"
          XRAY_SHA256="edcefc25b9b3195b11e18624c8269a969d6aabc39c6298a9a5ab29de15d46f3b"
          ARCHIVE="$RUNNER_TEMP/xray-android-arm64.zip"
          curl -fL --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip" \
            -o "$ARCHIVE"
          echo "${XRAY_SHA256}  ${ARCHIVE}" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/xray-core"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/xray-core"
          XRAY_BIN="$(find "$RUNNER_TEMP/xray-core" -type f -name xray -print -quit)"
          test -n "$XRAY_BIN"
          echo "Xray size before debug-section stripping: $(stat -c '%s' "$XRAY_BIN") bytes"
          # The upstream checksum is verified above. Remove only ELF debug sections;
          # Go runtime metadata and executable code remain intact.
          strip --strip-debug "$XRAY_BIN"
          echo "Xray size after debug-section stripping:  $(stat -c '%s' "$XRAY_BIN") bytes"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/xray
          install -m 755 "$XRAY_BIN" app/src/main/jniLibs/arm64-v8a/libxray.so
          curl -fL \
            "https://raw.githubusercontent.com/XTLS/Xray-core/${XRAY_VERSION}/LICENSE" \
            -o app/src/main/assets/xray/LICENSE
          test -x app/src/main/jniLibs/arm64-v8a/libxray.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libxray.so | grep -Eq 'Machine:.*AArch64'
          file app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Build debug and optimized Frago APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-optimized
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
