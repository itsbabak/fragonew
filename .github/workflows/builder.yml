
name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-arm64-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Frago
    runs-on: ubuntu-latest

    steps:
      # دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # پیدا کردن و استخراج ZIP سورس
      - name: Extract Frago source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Frago-ARM64-source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi

          echo "Using source: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/frago-extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/frago-extracted"

          GRADLEW="$(find "$GITHUB_WORKSPACE/frago-extracted" -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside extracted ZIP."
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/frago-extracted" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      # نصب Java 17 برای Android SDK
      - name: Setup Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      # نصب Android Build Tools
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "platform-tools"

      # تنظیم Java برای ساخت پروژه
      - name: Setup Java 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # آماده‌سازی Xray ARM64
      - name: Download Xray ARM64
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          XRAY_VERSION="v26.11.9"
          XRAY_SHA256="edcefc25b9b3195b11e18624c8269a969d6aabc39c6298a9a5ab29de15d46f3b"

          mkdir -p app/src/main/jniLibs/arm64-v8a

          curl -fL \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip" \
            -o xray.zip

          echo "$XRAY_SHA256  xray.zip" | sha256sum -c -

          mkdir -p xray-temp
          unzip -q xray.zip -d xray-temp

          XRAY_BIN="$(find xray-temp -type f \( -name xray -o -name Xray \) -print -quit)"

          if [ -z "$XRAY_BIN" ]; then
            echo "ERROR: Xray binary not found."
            find xray-temp -type f
            exit 1
          fi

          chmod +x "$XRAY_BIN"

          if command -v llvm-strip >/dev/null 2>&1; then
            llvm-strip --strip-debug "$XRAY_BIN" || true
          fi

          cp "$XRAY_BIN" app/src/main/jniLibs/arm64-v8a/libxray.so

          echo "Xray ARM64 installed."

      # ساخت APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --no-daemon clean assembleDebug assembleRelease

      # بررسی خروجی‌ها
      - name: Verify APK files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "APK outputs:"

          find app/build/outputs/apk -type f -name '*.apk' -print

          if ! find app/build/outputs/apk -type f -name '*.apk' | grep -q .; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      # دریافت APK دیباگ
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-debug-ARM64
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # دریافت APK ریلیز
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-release-ARM64
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
